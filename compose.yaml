name: priceledger
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: commerce
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 40
  kafka-volume:
    image: alpine:3.22
    user: "0:0"
    volumes: [kafkadata:/data]
    command: ["chown", "1000:1000", "/data"]
  kafka:
    depends_on:
      kafka-volume: {condition: service_completed_successfully}
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafkadata:/tmp/kraft-combined-logs]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 40
  topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic prices.changed --partitions 3 --replication-factor 1
  pricing:
    build:
      context: .
    command: ["/pricing"]
    environment:
      DATABASE_URL: postgres://commerce:localdev@db:5432/commerce?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${PRICING_HTTP_PORT:-18080}:8080","127.0.0.1:${PRICING_GRPC_PORT:-19090}:9090"]
  tests:
    profiles: [test]
    build:
      context: .
      target: tests
    environment:
      TEST_DATABASE_URL: postgres://commerce:localdev@db:5432/commerce?sslmode=disable
      TEST_REDIS_ADDR: redis:6379
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  pgdata:
  kafkadata:
