name: Go services
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l cmd internal api integration)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: make verify
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
